[remote.github]
owner = "xzeldon"
repo = "razer-battery-report"

[changelog]
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{%- set grouped = commits | group_by(attribute="group") -%}

{%- if grouped["New Features"] %}
### New Features
{% for commit in grouped["New Features"] %}
*   [{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}): \
  {{ commit.raw_message | default(value=commit.message) | split(pat="\n") | first }}\
  {%- if commit.remote and commit.remote.pr_number %} \
    ([#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}))\
  {%- endif %}\
  {%- if commit.remote and commit.remote.username %} \
    ([@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}))\
  {%- endif %}
{% endfor %}
{% endif -%}

